name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.asset }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: linux-x86_64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: linux-aarch64
          - runner: macos-14
            target: aarch64-apple-darwin
            asset: macos-aarch64
          - runner: ubuntu-latest
            target: aarch64-linux-android
            asset: android-aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Set up Android NDK
        # Only the Android entry needs a cross toolchain; the NDK supplies the
        # bionic sysroot and the aarch64-linux-android<API> clang wrapper that
        # rustc links the Termux binary against.
        if: matrix.target == 'aarch64-linux-android'
        run: |
          NDK_VERSION=r27c
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/ndk.zip" \
            "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip"
          unzip -q "$RUNNER_TEMP/ndk.zip" -d "$RUNNER_TEMP"
          echo "ANDROID_NDK_HOME=$RUNNER_TEMP/android-ndk-${NDK_VERSION}" >> "$GITHUB_ENV"
      - name: Build
        env:
          # Ignored by every non-Android target in the matrix.
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
        run: cargo build --release --bin cpuz-bench --target ${{ matrix.target }}
      - name: Verify kernel instruction mix
        run: |
          # The NDK's llvm-objdump can disassemble the Android ELF; host
          # objdump on x86_64 cannot, so fall back to the default lookup.
          NDK_OBJDUMP="${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-objdump"
          if [ -x "$NDK_OBJDUMP" ]; then
            python3 scripts/check_scalar_kernel.py "target/${{ matrix.target }}/release/cpuz-bench" "$NDK_OBJDUMP"
          else
            python3 scripts/check_scalar_kernel.py "target/${{ matrix.target }}/release/cpuz-bench"
          fi
      - name: Package
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/cpuz-bench" "dist/cpuz-bench-${{ matrix.asset }}"
          chmod +x "dist/cpuz-bench-${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: cpuz-bench-${{ matrix.asset }}
          path: dist/cpuz-bench-${{ matrix.asset }}
          if-no-files-found: error

  publish:
    name: publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Fetch CPUID's official ARM64 build
        # Vendored so `--official` works without the user hunting for the exe;
        # non-fatal because the replica still scores on its own if this fails.
        continue-on-error: true
        env:
          CPUZ_ARM64_VERSION: "1.06"
        run: |
          curl -fsSL --retry 3 -o /tmp/cpuz-arm64.zip \
            "https://download.cpuid.com/cpu-z/arm64/cpuz-arm64_${CPUZ_ARM64_VERSION}.zip"
          unzip -o -q /tmp/cpuz-arm64.zip cpuz_arm64.exe -d dist
          ls -l dist/cpuz_arm64.exe
      - name: Fetch CPUID's official x86_64 build
        # Same for x86_64: the CLI prefers CPUID's own kernel as ground truth.
        continue-on-error: true
        env:
          CPUZ_X64_VERSION: "3.01"
        run: |
          curl -fsSL --retry 3 -o /tmp/cpuz-x64.zip \
            "https://download.cpuid.com/cpu-z/cpu-z_${CPUZ_X64_VERSION}-en.zip"
          unzip -o -q /tmp/cpuz-x64.zip cpuz_x64.exe -d dist
          ls -l dist/cpuz_x64.exe
      - name: List assets
        run: ls -l dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/cpuz-bench-*
            dist/cpuz_arm64.exe
            dist/cpuz_x64.exe
          fail_on_unmatched_files: false
          generate_release_notes: true
