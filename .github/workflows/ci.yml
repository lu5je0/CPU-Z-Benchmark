name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: x86_64 tests + smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - name: Unit tests
        run: cargo test --release
      - name: Build
        run: cargo build --release --bin cpuz-bench
      - name: Cross-check aarch64 (release binaries)
        run: cargo check --release --bin cpuz-bench --target aarch64-unknown-linux-gnu
      - name: Cross-check Android aarch64 (Termux)
        # Same scalar-kernel config as the other aarch64 targets; `cargo check`
        # needs no NDK because it never links.
        run: |
          rustup target add aarch64-linux-android
          cargo check --release --bin cpuz-bench --target aarch64-linux-android
      - name: Kernel instruction mix (informational on x86-64)
        run: python3 scripts/check_scalar_kernel.py target/release/cpuz-bench
      - name: Smoke run
        run: ./target/release/cpuz-bench --duration 1000 --single-only --no-live -q

  arm64:
    # CPU-Z's own ARM64 build is scalar (`cpuz_arm64.exe` has no vector-register
    # floating-point instruction at all), so the aarch64 build must be scalar
    # too. This job enforces the invariant on real ARM64 hardware and measures
    # what letting LLVM vectorise would have done to the score.
    name: aarch64 scalar kernel + A/B
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build (scalar kernel, as shipped)
        run: cargo build --release --bin cpuz-bench
      - name: Verify kernel is scalar
        run: python3 scripts/check_scalar_kernel.py target/release/cpuz-bench
      - name: Score (scalar kernel)
        run: |
          cp target/release/cpuz-bench /tmp/cpuz-bench-scalar
          /tmp/cpuz-bench-scalar --duration 4000 -q
      - name: Build natural-vectorisation variant
        # Dropping the cargo config is the cleanest way to let LLVM vectorise
        # again (RUSTFLAGS would have to replace the target rustflags wholesale).
        run: |
          rm .cargo/config.toml
          cargo build --release --bin cpuz-bench
          cp target/release/cpuz-bench /tmp/cpuz-bench-natural
      - name: Score (LLVM free to SLP/loop vectorise)
        run: |
          python3 scripts/check_scalar_kernel.py /tmp/cpuz-bench-natural || true
          /tmp/cpuz-bench-natural --duration 4000 -q
      - name: Summary
        run: 'echo "compare the two score blocks above: scalar (shipped) vs vectorised"'
